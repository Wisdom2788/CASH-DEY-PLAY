name: Verify
on:
  pull_request:
  push:
    branches: [main, development, feature-implementation, hot-fixes]
permissions:
  contents: read
jobs:
  backend:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cash_dey_play_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=3s --health-retries=10
    defaults:
      run:
        working-directory: cash-dey-play-backend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cash_dey_play_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cash_dey_play_test
      REQUIRE_DB_TESTS: "true"
      TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_REDIS_TESTS: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cash-dey-play-backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm test -- --runInBand
      - run: npm run db:ledger:reconcile
      - run: npm run build
  frontend:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cash-dey-play-frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cash-dey-play-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Install ranked browser acceptance dependencies
        run: |
          npm ci --prefix ../cash-dey-play-backend
          npx playwright install --with-deps chromium webkit
      - run: npm run test:ranked:browser
      - name: Save ranked browser screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ranked-browser-screenshots
          path: /tmp/ranked-*-mobile.png
          if-no-files-found: error
          retention-days: 7
